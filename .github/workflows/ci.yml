name: Python App CI

on:
    workflow_dispatch:
    push:
        paths:
            - "main.py"
            - "Dockerfile"
            - "requirement.txt"
            - ".github/workflows/**"
        branches:
            - main

jobs:
    build-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              run: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Install Dependencies
              run: pip install -r requirements.txt

            - name: Run Tests
              run: echo ""

    docker-build-push:
        runs-on: ubuntu-latest
        needs: build-test
        steps:
            - name: Checkout Code
              run: actions/checkout@v7

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Push Image to Docker Hub
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: |
                      ${{secrets.DOCKERHUB_USERNAME}}/python-app:latest
                      ${{secrets.DOCKERHUB_USERNAME}}/python-app:${{github.ref_name}}
                      ${{secrets.DOCKERHUB_USERNAME}}/python-app:${{github.sha}}
